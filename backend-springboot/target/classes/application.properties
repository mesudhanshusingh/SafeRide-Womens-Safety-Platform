# Server Port Configuration
server.port=8080

# Relational Database Configuration (Defaults to H2 in-memory DB for local runs, supports MySQL via environment variables)
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:h2:mem:saferide_db;MODE=MySQL;DB_CLOSE_DELAY=-1}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:sa}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:}

# JPA / Hibernate Properties
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false

# MongoDB Configuration
spring.data.mongodb.uri=${SPRING_DATA_MONGODB_URI:mongodb://localhost:27017/saferide_mongo}

# JWT Configuration (Using a secure HS256-compliant secret key)
# Secret must be at least 256 bits (32 bytes) long
jwt.secret=saferidekeysecret2026forwomensafetyplatformsecuredjwt
jwt.expiration-ms=86400000

# Logging Configurations
logging.level.org.springframework.web=INFO
logging.level.com.saferide=DEBUG
