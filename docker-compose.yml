version: '3.8'

services:
  # 1. Relational Database (MySQL)
  mysql:
    image: mysql:8.0
    container_name: saferide_mysql
    ports:
      - "3306:3306"
    environment:
      MYSQL_DATABASE: saferide_db
      MYSQL_ROOT_PASSWORD: rootpassword
    volumes:
      - mysql_data:/var/lib/mysql
      - ./database/schema.sql:/docker-entrypoint-initdb.d/schema.sql
    restart: unless-stopped
    networks:
      - saferide_net

  # 2. Document/Telemetry Database (MongoDB)
  mongodb:
    image: mongo:latest
    container_name: saferide_mongodb
    ports:
      - "27017:27017"
    volumes:
      - mongo_data:/data/db
    restart: unless-stopped
    networks:
      - saferide_net

  # 3. Python FastAPI AI Service
  ai-service:
    build: ./ai-service-python
    container_name: saferide_ai_service
    ports:
      - "8000:8000"
    restart: unless-stopped
    networks:
      - saferide_net

  # 4. Java Spring Boot Backend
  backend:
    build: ./backend-springboot
    container_name: saferide_backend
    ports:
      - "8080:8080"
    depends_on:
      - mysql
      - mongodb
    environment:
      - SPRING_DATASOURCE_URL=jdbc:mysql://mysql:3306/saferide_db?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
      - SPRING_DATA_MONGODB_URI=mongodb://mongodb:27017/saferide_mongo
    restart: unless-stopped
    networks:
      - saferide_net

  # 5. Frontend Client (Served on Nginx)
  frontend:
    image: nginx:alpine
    container_name: saferide_frontend
    ports:
      - "80:80"
    volumes:
      - ./frontend:/usr/share/nginx/html
    restart: unless-stopped
    networks:
      - saferide_net

volumes:
  mysql_data:
  mongo_data:

networks:
  saferide_net:
    driver: bridge
